[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session_rhino"
version = "0.11.0"
description = "RhinoCommon converters for session_py geometry"
authors = [{name = "Petras Vestartas", email = "petrasvestartas@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["session_py"]

[project.urls]
Homepage = "https://github.com/petrasvestartas/session_rhino"
Repository = "https://github.com/petrasvestartas/session_rhino"

[tool.hatch.build]
src-layout = true

[tool.hatch.build.targets.wheel]
